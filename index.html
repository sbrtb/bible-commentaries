<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Study Link Launcher</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .button-zone {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            transition: background 0.2s;
        }
        .btn-blue { background-color: #007BFF; }
        .btn-blue:hover { background-color: #0056b3; }
        
        .btn-teal { background-color: #17a2b8; }
        .btn-teal:hover { background-color: #117a8b; }
        
        .btn-orange { background-color: #fd7e14; }
        .btn-orange:hover { background-color: #da6204; }
        
        .btn-green { background-color: #28a745; }
        .btn-green:hover { background-color: #218838; }

        .note {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
            line-height: 1.4;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bible Study Link Launcher</h2>
    
    <div class="input-group">
        <label for="reference">Enter Bible Reference:</label>
        <input type="text" id="reference" placeholder="e.g., 2 Kings 3:4 or John 3:16">
    </div>
    
    <div class="button-zone">
        <button class="btn btn-blue" onclick="openSingleLink('sonic')">➔ Sonic Light (Dr. Constable)</button>
        <button class="btn btn-teal" onclick="openSingleLink('bh-gen')">➔ Bible Hub (Generic Verse)</button>
        <button class="btn btn-teal" onclick="openSingleLink('bh-com')">➔ Bible Hub (Commentary Index)</button>
        <button class="btn btn-orange" onclick="openSingleLink('precept')">➔ Precept Austin</button>
        <button class="btn btn-green" onclick="openSingleLink('free')">➔ Free Bible Commentary</button>
    </div>
    
    <p class="note">
        Type your reference first, then click any button to open that specific commentary in a new window/tab. 
    </p>
</div>

<script>
function openSingleLink(target) {
    let rawRef = document.getElementById('reference').value.trim();
    if (!rawRef) {
        alert("Please enter a reference first.");
        return;
    }

    // --- Format Parsing ---
    let cleanRef = rawRef.toLowerCase();
    let parts = cleanRef.split(/\s+(?=\d)/); 
    let book = parts[0];
    let verses = parts[1] ? parts[1] : "";

    // Handle numbered books (e.g., 2 Kings, 1 John, 2 Corinthians)
    if (!isNaN(cleanRef.charAt(0)) && cleanRef.charAt(1) === ' ') {
        book = cleanRef.substring(0, 3).replace(" ", "_"); // base structure: "2_kings"
        let remaining = cleanRef.substring(3).trim();
        let remainingParts = remaining.split(/\s+(?=\d)/);
        if(remainingParts[0]) book += remainingParts[0];
        verses = remainingParts[1] ? remainingParts[1] : remaining;
    }

    // Keep the underscore for Bible Hub links, but strip it for Sonic Light
    let bookSonicLight = book.replace("_", ""); // soniclight needs "2kings"
    let bibleHubVerses = verses.replace(":", "-");

    let finalUrl = "";

    // --- URL Generation ---
    switch(target) {
        case 'sonic':
            finalUrl = `https://soniclight.com/tcon/notes/html/${bookSonicLight}/${bookSonicLight}.htm`;
            break;
        case 'bh-gen':
            // Fixed: Now accurately targets https://biblehub.com/2_kings/3-4.htm
            finalUrl = `https://biblehub.com/${book}/${bibleHubVerses}.htm`;
            break;
        case 'bh-com':
            finalUrl = `https://biblehub.com/commentaries/${book}/${bibleHubVerses}.htm`;
            break;
        case 'precept':
            finalUrl = `https://www.google.com/search?q=site:preceptaustin.org+${encodeURIComponent(rawRef)}`;
            break;
        case 'free':
            finalUrl = `https://www.google.com/search?q=site:freebiblecommentary.org+${encodeURIComponent(rawRef)}`;
            break;
    }

    // Open in a new tab/window
    if (finalUrl) {
        window.open(finalUrl, '_blank');
    }
}
</script>

</body>
</html>
