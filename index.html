        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .button-zone {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            transition: background 0.2s;
        }
        .btn-blue { background-color: #007BFF; }
        .btn-blue:hover { background-color: #0056b3; }
        
        .btn-teal { background-color: #17a2b8; }
        .btn-teal:hover { background-color: #117a8b; }
        
        .btn-orange { background-color: #fd7e14; }
        .btn-orange:hover { background-color: #da6204; }
        
        .btn-green { background-color: #28a745; }
        .btn-green:hover { background-color: #218838; }

        .note {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
            line-height: 1.4;
            border-top: 1px solid #eee;
            padding-top: 15px;

        <input type="text" id="reference" placeholder="e.g., 2 Kgs 3:4, 1 Cor 13, Rev 21:1">
    </div>
    
    <div class="button-zone">
        <button class="btn btn-blue" onclick="openSingleLink('sonic')">➔ Sonic Light (Dr. Constable)</button>
        <button class="btn btn-teal" onclick="openSingleLink('bh-gen')">➔ Bible Hub (Generic Verse)</button>
        <button class="btn btn-teal" onclick="openSingleLink('bh-com')">➔ Bible Hub (Commentary Index)</button>
        <button class="btn btn-orange" onclick="openSingleLink('precept')">➔ Precept Austin</button>
        <button class="btn btn-green" onclick="openSingleLink('free')">➔ Free Bible Commentary</button>
    </div>
    
    <p class="note">
        Accepts any standard or abbreviated Old and New Testament format. Google searches are now automatically translated to full book names.
    </p>
</div>

function openSingleLink(target) {
    let rawRef = document.getElementById('reference').value.trim();
    if (!rawRef) {
        alert("Please enter a reference first.");
        return;
    }

    // Clean input: remove periods, fix spacing, convert to lowercase
    let cleanInput = rawRef.toLowerCase().replace(/\./g, "").replace(/\s+/g, " ").trim();

    // Isolate the book title from chapters/verses by splitting at the first digit encounter
    let match = cleanInput.match(/^([a-z0-9\s]+?)\s*(\d.*)$/i);
    
    let typedBook = "";
    let verses = "";

    if (match) {
        typedBook = match[1].trim();
        verses = match[2].trim();
    } else {
        typedBook = cleanInput;
    }

    // Lookup structural standard name (e.g., "2_kings" or "deuteronomy")
    let standardBook = bookMap[typedBook];

    if (!standardBook) {
        standardBook = typedBook.replace(" ", "_");
    }

    // Prepare variables for URLs
    let bookSonicLight = standardBook.replace("_", ""); 
    let bibleHubVerses = verses.replace(":", "-");
    
    // Create a clean readable string version for search engine strings (e.g. "2 kings 3:4")
    let cleanSearchQuery = `${standardBook.replace("_", " ")} ${verses}`;

    let finalUrl = "";

    switch(target) {
        case 'sonic':
            finalUrl = `https://soniclight.com/tcon/notes/html/${bookSonicLight}/${bookSonicLight}.htm`;
            break;
        case 'bh-gen':
            finalUrl = `https://biblehub.com/${standardBook}/${bibleHubVerses}.htm`;
            break;
        case 'bh-com':
            finalUrl = `https://biblehub.com/commentaries/${standardBook}/${bibleHubVerses}.htm`;
            break;
        case 'precept':
            finalUrl = `https://www.google.com/search?q=site:preceptaustin.org+${encodeURIComponent(cleanSearchQuery)}`;
            break;
        case 'free':
            finalUrl = `https://www.google.com/search?q=site:freebiblecommentary.org+${encodeURIComponent(cleanSearchQuery)}`;
            break;
    }

    if (finalUrl) {
        window.open(finalUrl, '_blank');
    }
}
